

services:
  ferreteria: #nombre de la app establecido en application.properties
    build: Ferreteria-industrial #nombre de la carpeta donde está el DockerFile
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: no
    depends_on:
      mysql:
        condition: service_healthy
   #configuraciones de base de datos dockerizada
  mysql:
    image: mysql:8.0.33 #misma versión que esté en el pom
    ports:
      - "3307:3306"
    environment:
      MYSQL_USER: brisabc
      MYSQL_ROOT_PASSWORD: Genius8815063
      MYSQL_PASSWORD: Genius8815063
      MYSQL_DATABASE: ferreteria
    restart: no
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 10